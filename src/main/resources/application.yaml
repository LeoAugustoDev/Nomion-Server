spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: nomion-server

  profiles:
    default: dev

nomion:
  security:
    jwt:
      secret: ${JWT_SECRET}
      access-token-expiration: 15m
      refresh-token-expiration: 7d
      tenant-selection-token-expiration: 5m
